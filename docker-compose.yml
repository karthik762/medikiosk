services:
  mysql:
    image: mysql:8.4
    container_name: medikiosk-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-medikiosk}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_USER: ${DB_USERNAME:-medikiosk}
      MYSQL_PASSWORD: ${DB_PASSWORD:-medikiosk}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - medikiosk_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  medikiosk_mysql_data:
    driver: local
