spring:
  application:
    name: medikiosk-backend-test

  datasource:
    url: jdbc:h2:mem:medikiosk_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.type.preferred_uuid_type: VARCHAR
    show-sql: true
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 15MB

app:
  cors:
    allowed-origins: http://localhost:5173
  security:
    jwt:
      secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      expiration-ms: 86400000
  voice:
    provider: mock
    stt-enabled: true
    tts-enabled: true
    max-audio-size-bytes: 10485760
  abdm:
    mode: MOCK
    base-url: mock://localhost/abdm-gateway
    client-id: MOCK_CLIENT_ID
    client-secret: MOCK_CLIENT_SECRET
    timeout-ms: 5000
    enabled: true
  his:
    mode: MOCK
    base-url: mock://localhost/his-api
    client-id: MOCK_HIS_CLIENT_ID
    client-secret: MOCK_HIS_CLIENT_SECRET
    timeout-ms: 5000
    enabled: true
  healthlake:
    mode: MOCK
    enabled: true
    endpoint: mock://healthlake.ap-south-1.amazonaws.com/datastore/mock-ds/r4/
    datastore-id: mock-healthlake-datastore
    region: ap-south-1
    timeout-ms: 5000

kiosk:
  registration:
    rate-limit:
      enabled: true
      capacity: 5
      refill-tokens: 5
      refill-duration-seconds: 60
      allow-trusted-proxy-headers: false

medikiosk:
  demo:
    enabled: false
  ocr:
    provider: mock
  ai:
    provider: mock

logging:
  level:
    root: INFO
    com.medikiosk: DEBUG
    org.flywaydb: DEBUG
