server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: medikiosk-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:medikiosk}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:root}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 20000
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.dialect: org.hibernate.dialect.MySQLDialect
      hibernate.type.preferred_uuid_type: VARCHAR
      hibernate.format_sql: false
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 15MB

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  security:
    jwt:
      secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  voice:
    provider: ${VOICE_PROVIDER:openai}
    stt-enabled: ${VOICE_STT_ENABLED:true}
    tts-enabled: ${VOICE_TTS_ENABLED:true}
    max-audio-size-bytes: ${VOICE_MAX_AUDIO_SIZE:10485760}
  abdm:
    mode: ${ABDM_MODE:MOCK}
    base-url: ${ABDM_BASE_URL:https://dev.abdm.gov.in/gateway}
    client-id: ${ABDM_CLIENT_ID:}
    client-secret: ${ABDM_CLIENT_SECRET:}
    timeout-ms: ${ABDM_TIMEOUT_MS:5000}
    enabled: ${ABDM_ENABLED:true}
  his:
    mode: ${HIS_MODE:MOCK}
    base-url: ${HIS_BASE_URL:https://his.hospital.local/api}
    client-id: ${HIS_CLIENT_ID:}
    client-secret: ${HIS_CLIENT_SECRET:}
    timeout-ms: ${HIS_TIMEOUT_MS:5000}
    enabled: ${HIS_ENABLED:true}
  healthlake:
    mode: ${HEALTHLAKE_MODE:MOCK}
    enabled: ${HEALTHLAKE_ENABLED:true}
    endpoint: ${HEALTHLAKE_ENDPOINT:}
    datastore-id: ${HEALTHLAKE_DATASTORE_ID:}
    region: ${HEALTHLAKE_REGION:ap-south-1}
    timeout-ms: ${HEALTHLAKE_TIMEOUT_MS:5000}

kiosk:
  registration:
    rate-limit:
      enabled: ${KIOSK_RATE_LIMIT_ENABLED:true}
      capacity: ${KIOSK_RATE_LIMIT_CAPACITY:10}
      refill-tokens: ${KIOSK_RATE_LIMIT_REFILL_TOKENS:10}
      refill-duration-seconds: ${KIOSK_RATE_LIMIT_REFILL_DURATION:60}
      allow-trusted-proxy-headers: ${KIOSK_RATE_LIMIT_ALLOW_PROXY_HEADERS:false}
medikiosk:
  demo:
    enabled: ${DEMO_ENABLED:true}
  ocr:
    provider: ${OCR_PROVIDER:tesseract}
    tesseract-data-path: ${TESSERACT_DATA_PATH:/usr/share/tesseract-ocr/4.00/tessdata}
    language: ${OCR_LANGUAGE:eng}
    confidence-threshold: ${OCR_CONFIDENCE_THRESHOLD:0.75}
  ai:
    provider: ${AI_PROVIDER:openai}
    base-url: ${AI_BASE_URL:https://openrouter.ai/api/v1}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:google/gemini-2.0-flash-001}
    fast-model: ${AI_FAST_MODEL:google/gemini-2.0-flash-001}
    strong-model: ${AI_STRONG_MODEL:anthropic/claude-3.5-sonnet}
    timeout-ms: ${AI_TIMEOUT_MS:5000}
    temperature: ${AI_TEMPERATURE:0.2}

logging:
  level:
    root: INFO
    com.medikiosk: DEBUG
    org.springframework.web: INFO
    org.springframework.security: INFO
