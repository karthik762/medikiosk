spring:
  config:
    activate:
      on-profile: local

  datasource:
    url: jdbc:h2:mem:medikiosk_local;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.type.preferred_uuid_type: VARCHAR
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

medikiosk:
  demo:
    enabled: true
  ai:
    provider: mock
    model: mock-reasoner-v1

logging:
  level:
    com.medikiosk: DEBUG
